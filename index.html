<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Timer</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1 class="title">Boss Floor</h1>

<select id="floor">
<option>Floor 1</option>
<option>Floor 2</option>
<option>Floor 3</option>
</select>

<div class="boss-grid">

<div class="boss">
<h2>Scald</h2>
<div class="timer" id="scald">READY</div>
<button onclick="startTimer('scald')">Start</button>
</div>

<div class="boss">
<h2>Berserker</h2>
<div class="timer" id="berserker">READY</div>
<button onclick="startTimer('berserker')">Start</button>
</div>

<div class="boss">
<h2>Vulva</h2>
<div class="timer" id="vulva">READY</div>
<button onclick="startTimer('vulva')">Start</button>
</div>

<div class="boss">
<h2>Warlord</h2>
<div class="timer" id="warlord">READY</div>
<button onclick="startTimer('warlord')">Start</button>
</div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
