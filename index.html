<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Boss Timer</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<h1>Guild Boss Timer</h1>

<div class="selectors">

<select id="floor">
<option value="1">Floor 1</option>
<option value="2">Floor 2</option>
<option value="3">Floor 3</option>
<option value="4">Floor 4</option>
<option value="5">Floor 5</option>
</select>

<select id="mode">
<option value="interserver">Interserver (2h)</option>
<option value="normal">Normal (8h)</option>
</select>

<input id="player" placeholder="Your name">

</div>

<div class="boss-grid">

<div class="boss">
<h2>Scald</h2>
<div id="scald">READY</div>
<div class="bar"><div id="scald_bar"></div></div>
<div id="scald_by"></div>
<button onclick="startTimer('scald')">Start</button>
<button onclick="resetTimer('scald')">Reset</button>
</div>

<div class="boss">
<h2>Berserker</h2>
<div id="berserker">READY</div>
<div class="bar"><div id="berserker_bar"></div></div>
<div id="berserker_by"></div>
<button onclick="startTimer('berserker')">Start</button>
<button onclick="resetTimer('berserker')">Reset</button>
</div>

<div class="boss">
<h2>Vulva</h2>
<div id="vulva">READY</div>
<div class="bar"><div id="vulva_bar"></div></div>
<div id="vulva_by"></div>
<button onclick="startTimer('vulva')">Start</button>
<button onclick="resetTimer('vulva')">Reset</button>
</div>

<div class="boss">
<h2>Warlord</h2>
<div id="warlord">READY</div>
<div class="bar"><div id="warlord_bar"></div></div>
<div id="warlord_by"></div>
<button onclick="startTimer('warlord')">Start</button>
<button onclick="resetTimer('warlord')">Reset</button>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
